name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Firebase's client-side web config is public by design (security
      # comes from Firestore rules, not this key) — safe to commit here.
      # No server secrets (Stripe, Firebase Admin) are needed: tests mock
      # the booking API at the browser level and never invoke the real
      # server routes that touch those credentials.
      NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyBIPA90v3Rj1prUAd26vR9_UiQx1fMcI0w
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: jolly-and-honest.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: jolly-and-honest
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: jolly-and-honest.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "496580778009"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:496580778009:web:93441fbc8e1c8496a7f288"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
